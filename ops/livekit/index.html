<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reaper Master Monitor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101416;
        --panel: #172023;
        --line: #2d3b40;
        --text: #edf3f1;
        --muted: #9fb0ae;
        --accent: #72d6b0;
        --warn: #e4b45f;
        --bad: #ef7a7a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(840px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 48px);
        line-height: 1;
        font-weight: 750;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--muted);
        white-space: nowrap;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--warn);
      }

      .status.connected .dot {
        background: var(--accent);
      }

      .status.failed .dot {
        background: var(--bad);
      }

      section {
        border-top: 1px solid var(--line);
        padding: 24px 0;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      button {
        border: 0;
        border-radius: 6px;
        min-height: 44px;
        padding: 0 18px;
        background: var(--accent);
        color: #08110f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }

      audio {
        width: 100%;
        margin-top: 18px;
      }

      pre {
        overflow: auto;
        min-height: 180px;
        margin: 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0b0f11;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 560px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .status {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Reaper Master</h1>
        <div id="status" class="status">
          <span class="dot"></span>
          <span id="statusText">standby</span>
        </div>
      </header>

      <section>
        <div class="controls">
          <button id="connect">Connect</button>
          <button id="disconnect" class="secondary">Disconnect</button>
        </div>
        <div id="audio"></div>
      </section>

      <section>
        <pre id="log"></pre>
      </section>
    </main>

    <script type="module">
      import {
        Room,
        RoomEvent,
      } from "https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs";

      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const logEl = document.getElementById("log");
      const audioEl = document.getElementById("audio");
      const connectButton = document.getElementById("connect");
      const disconnectButton = document.getElementById("disconnect");

      let room;

      function log(message) {
        const time = new Date().toLocaleTimeString();
        logEl.textContent = `[${time}] ${message}\n${logEl.textContent}`.slice(0, 5000);
      }

      function setStatus(text, kind = "") {
        statusEl.className = `status ${kind}`;
        statusText.textContent = text;
      }

      async function connect() {
        if (room) {
          await room.disconnect();
          audioEl.replaceChildren();
        }

        setStatus("connecting");
        const tokenResponse = await fetch("/token?room=reaper-master", {
          cache: "no-store",
        });
        if (!tokenResponse.ok) {
          throw new Error(`token failed: ${tokenResponse.status}`);
        }
        const { url, token, identity } = await tokenResponse.json();
        room = new Room({ adaptiveStream: false, dynacast: false });

        room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          log(`subscribed ${track.kind} from ${participant.identity}`);
          if (track.kind === "audio") {
            const element = track.attach();
            element.controls = true;
            element.autoplay = true;
            audioEl.replaceChildren(element);
            element.play().catch((err) => log(`play blocked: ${err.message}`));
          }
        });

        room.on(RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach((element) => element.remove());
          log(`unsubscribed ${track.kind}`);
        });

        room.on(RoomEvent.Disconnected, (reason) => {
          setStatus("disconnected");
          log(`disconnected ${reason || ""}`.trim());
        });

        await room.connect(url, token, { autoSubscribe: true });
        setStatus("connected", "connected");
        log(`connected as ${identity}`);
      }

      connectButton.addEventListener("click", async () => {
        try {
          await connect();
        } catch (err) {
          setStatus("failed", "failed");
          log(err.stack || err.message || String(err));
        }
      });

      disconnectButton.addEventListener("click", async () => {
        if (room) {
          await room.disconnect();
          room = undefined;
        }
        audioEl.replaceChildren();
        setStatus("standby");
      });
    </script>
  </body>
</html>
