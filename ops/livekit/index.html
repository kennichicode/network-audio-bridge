<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reaper Listen</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1113;
        --band: #161b1f;
        --line: #303a40;
        --text: #eef5f2;
        --muted: #9eaaa7;
        --accent: #4fd39a;
        --warn: #e8b957;
        --bad: #f06f72;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        padding: 10px 0 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 8vw, 68px);
        line-height: 0.95;
        font-weight: 800;
      }

      .room {
        margin-top: 10px;
        color: var(--muted);
        font-size: 15px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--band);
        color: var(--muted);
        white-space: nowrap;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--warn);
      }

      .pill.connected .dot {
        background: var(--accent);
      }

      .pill.failed .dot {
        background: var(--bad);
      }

      section {
        border-top: 1px solid var(--line);
        padding: 22px 0;
      }

      .join {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
      }

      input {
        min-height: 48px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #0b0e10;
        color: var(--text);
        font: inherit;
        font-size: 18px;
        padding: 0 13px;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        padding: 0 22px;
        background: var(--accent);
        color: #07100c;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--line);
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      .transport {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      audio {
        width: 100%;
        margin-top: 16px;
      }

      .meters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }

      .meter {
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .meter b {
        display: block;
        font-size: 22px;
        line-height: 1.1;
      }

      .meter span {
        color: var(--muted);
        font-size: 13px;
      }

      .meter small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .state-good {
        color: var(--accent);
      }

      .state-warn {
        color: var(--warn);
      }

      .state-bad {
        color: var(--bad);
      }

      pre {
        overflow: auto;
        min-height: 160px;
        margin: 0;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #080b0d;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      @media (max-width: 620px) {
        header,
        .join {
          grid-template-columns: 1fr;
          flex-direction: column;
        }

        header {
          display: block;
        }

        .pill {
          margin-top: 16px;
          width: 100%;
          justify-content: center;
        }

        .join {
          display: grid;
        }

        button {
          width: 100%;
        }

        .meters {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Reaper Listen</h1>
          <div class="room">room: reaper-master / source: Mac mini</div>
        </div>
        <div id="status" class="pill">
          <span class="dot"></span>
          <span id="statusText">locked</span>
        </div>
      </header>

      <section>
        <form id="joinForm" class="join">
          <input id="passcode" name="passcode" type="password" autocomplete="off" placeholder="合言葉" />
          <button id="listen" type="submit">Listen</button>
        </form>
      </section>

      <section>
        <div class="transport">
          <button id="disconnect" class="secondary" type="button">Disconnect</button>
          <button id="unlock" class="secondary" type="button">Unlock Audio</button>
        </div>
        <div id="audio"></div>
      </section>

      <section class="meters">
        <div class="meter"><b id="proof">locked</b><span>listen proof</span><small id="proofDetail">Press Listen</small></div>
        <div class="meter"><b id="listenerMode">locked</b><span>token mode</span><small id="listenerModeDetail">not connected</small></div>
        <div class="meter"><b id="publisher">none</b><span>publisher</span></div>
        <div class="meter"><b id="track">none</b><span>track</span></div>
        <div class="meter"><b id="quality">unknown</b><span>connection</span></div>
        <div class="meter"><b id="player">none</b><span>audio element</span></div>
        <div class="meter"><b id="packets">0</b><span>packets received</span><small id="packetDelta">+0/s</small></div>
        <div class="meter"><b id="bytes">0 B</b><span>bytes received</span><small id="byteDelta">+0 B/s</small></div>
        <div class="meter"><b id="level">unknown</b><span>audio level</span></div>
        <div class="meter"><b id="jitter">unknown</b><span>jitter</span></div>
        <div class="meter"><b id="loss">unknown</b><span>packets lost</span></div>
      </section>

      <section>
        <pre id="log"></pre>
      </section>
    </main>

    <script type="module">
      import {
        ConnectionState,
        Room,
        RoomEvent,
      } from "https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.esm.mjs";

      const statusEl = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const logEl = document.getElementById("log");
      const audioEl = document.getElementById("audio");
      const joinForm = document.getElementById("joinForm");
      const passcodeInput = document.getElementById("passcode");
      const listenButton = document.getElementById("listen");
      const disconnectButton = document.getElementById("disconnect");
      const unlockButton = document.getElementById("unlock");
      const proofEl = document.getElementById("proof");
      const proofDetailEl = document.getElementById("proofDetail");
      const listenerModeEl = document.getElementById("listenerMode");
      const listenerModeDetailEl = document.getElementById("listenerModeDetail");
      const publisherEl = document.getElementById("publisher");
      const trackEl = document.getElementById("track");
      const qualityEl = document.getElementById("quality");
      const playerEl = document.getElementById("player");
      const packetsEl = document.getElementById("packets");
      const packetDeltaEl = document.getElementById("packetDelta");
      const bytesEl = document.getElementById("bytes");
      const byteDeltaEl = document.getElementById("byteDelta");
      const levelEl = document.getElementById("level");
      const jitterEl = document.getElementById("jitter");
      const lossEl = document.getElementById("loss");

      let room;
      let audioNode;
      let audioContext;
      let currentAudioTrack;
      let statsTimer;
      let lastStats;
      let playBlocked = false;

      function log(message) {
        const time = new Date().toLocaleTimeString();
        logEl.textContent = `[${time}] ${message}\n${logEl.textContent}`.slice(0, 5000);
      }

      function setStatus(text, kind = "") {
        statusEl.className = `pill ${kind}`;
        statusText.textContent = text;
      }

      function setProof(text, detail, kind = "") {
        proofEl.textContent = text;
        proofEl.className = kind;
        proofDetailEl.textContent = detail;
      }

      function setListenerMode(permissions) {
        const canPublish = permissions?.canPublish === true;
        const canSubscribe = permissions?.canSubscribe !== false;
        if (!canPublish && canSubscribe) {
          listenerModeEl.textContent = "subscribe-only";
          listenerModeEl.className = "state-good";
          listenerModeDetailEl.textContent = "canSubscribe=true / canPublish=false";
        } else if (canPublish) {
          listenerModeEl.textContent = "publish enabled";
          listenerModeEl.className = "state-bad";
          listenerModeDetailEl.textContent = "listener token can publish";
        } else {
          listenerModeEl.textContent = "unknown";
          listenerModeEl.className = "state-warn";
          listenerModeDetailEl.textContent = "token permission not confirmed";
        }
      }

      function resetAudio() {
        stopStats();
        audioEl.replaceChildren();
        audioNode = undefined;
        currentAudioTrack = undefined;
        playBlocked = false;
        setProof("no audio", "waiting for subscribed audio track", "state-warn");
        publisherEl.textContent = "none";
        trackEl.textContent = "none";
        playerEl.textContent = "none";
        packetsEl.textContent = "0";
        packetDeltaEl.textContent = "+0/s";
        bytesEl.textContent = "0 B";
        byteDeltaEl.textContent = "+0 B/s";
        levelEl.textContent = "unknown";
        jitterEl.textContent = "unknown";
        lossEl.textContent = "unknown";
      }

      function formatBytes(value) {
        const bytes = Number(value || 0);
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
      }

      function updatePlayerState() {
        if (!audioNode) {
          playerEl.textContent = "none";
          return;
        }
        const state = audioNode.paused ? "paused" : "playing";
        const mute = audioNode.muted ? "muted" : "unmuted";
        playerEl.textContent = `${state} / ${mute}`;
        if (playBlocked) {
          setStatus("audio blocked", "connected");
        }
      }

      function stopStats() {
        if (statsTimer) {
          clearInterval(statsTimer);
          statsTimer = undefined;
        }
        lastStats = undefined;
      }

      function pickInboundAudioStats(report) {
        let inbound;
        let audioLevel;
        if (!report) return { inbound, audioLevel };
        for (const stat of report.values()) {
          const isAudio =
            stat.kind === "audio" ||
            stat.mediaType === "audio" ||
            stat.trackIdentifier === currentAudioTrack?.mediaStreamTrack?.id;
          if (stat.type === "inbound-rtp" && isAudio) {
            inbound = stat;
          }
          if (typeof stat.audioLevel === "number") {
            audioLevel = Math.max(audioLevel ?? 0, stat.audioLevel);
          }
        }
        return { inbound, audioLevel };
      }

      async function updateStats() {
        if (!currentAudioTrack) return;
        try {
          const report = await currentAudioTrack.getRTCStatsReport?.();
          const { inbound, audioLevel } = pickInboundAudioStats(report);
          const now = performance.now();
          const packets = Number(inbound?.packetsReceived || 0);
          const bytes = Number(inbound?.bytesReceived || 0);
          const lost = inbound?.packetsLost;
          const jitterSeconds = inbound?.jitter;
          const elapsedSeconds = lastStats ? Math.max(0.1, (now - lastStats.at) / 1000) : 1;
          const packetDelta = lastStats ? packets - lastStats.packets : 0;
          const byteDelta = lastStats ? bytes - lastStats.bytes : 0;
          const packetsPerSecond = Math.max(0, Math.round(packetDelta / elapsedSeconds));
          const bytesPerSecond = Math.max(0, Math.round(byteDelta / elapsedSeconds));
          const receivingAudio = packetDelta > 0 || byteDelta > 0;
          const playerReady = audioNode && !audioNode.paused && !audioNode.muted && !playBlocked;

          packetsEl.textContent = String(packets);
          packetDeltaEl.textContent = `+${packetsPerSecond}/s`;
          bytesEl.textContent = formatBytes(bytes);
          byteDeltaEl.textContent = `+${formatBytes(bytesPerSecond)}/s`;
          lossEl.textContent = Number.isFinite(lost) ? String(lost) : "unknown";
          jitterEl.textContent = Number.isFinite(jitterSeconds)
            ? `${(jitterSeconds * 1000).toFixed(1)} ms`
            : "unknown";
          levelEl.textContent = Number.isFinite(audioLevel)
            ? `${Math.round(audioLevel * 100)}%`
            : "unknown";
          updatePlayerState();

          if (receivingAudio && playerReady) {
            setProof("Audio OK", `receiving +${packetsPerSecond} pkt/s, +${formatBytes(bytesPerSecond)}/s`, "state-good");
            setStatus("audio playing", "connected");
          } else if (receivingAudio && playBlocked) {
            setProof("Unlock needed", "packets are arriving, but browser blocked playback", "state-warn");
            setStatus("tap Unlock Audio", "connected");
          } else if (receivingAudio) {
            setProof("Packets OK", "audio packets are arriving; player is not playing yet", "state-warn");
            setStatus("track subscribed", "connected");
          } else if (lastStats && room?.state === ConnectionState.Connected) {
            setProof("No packets", "connected, but inbound audio counters did not move", "state-bad");
            setStatus("no audio frames");
          }

          lastStats = { at: now, packets, bytes };
        } catch (err) {
          log(`stats unavailable: ${err.message || String(err)}`);
        }
      }

      function startStats(track) {
        stopStats();
        currentAudioTrack = track;
        statsTimer = setInterval(updateStats, 1000);
        updateStats();
      }

      async function unlockAudioGesture() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioContext) {
          audioContext = new AudioContextClass();
        }
        if (audioContext.state !== "running") {
          await audioContext.resume();
        }
      }

      function attachAudio(track, participant) {
        if (track.kind !== "audio") return;
        const element = track.attach();
        element.controls = true;
        element.autoplay = true;
        element.playsInline = true;
        audioNode = element;
        audioEl.replaceChildren(element);
        publisherEl.textContent = participant.identity || "unknown";
        trackEl.textContent = track.sid || "audio";
        setProof("track attached", "waiting for inbound packet movement", "state-warn");
        startStats(track);
        element.addEventListener("playing", () => {
          playBlocked = false;
          updatePlayerState();
          setStatus("audio playing", "connected");
        });
        element.addEventListener("pause", updatePlayerState);
        element.addEventListener("waiting", () => {
          setProof("Waiting", "audio element is buffering", "state-warn");
          setStatus("audio waiting");
        });
        element.addEventListener("stalled", () => {
          setProof("Stalled", "browser audio element stalled", "state-bad");
          setStatus("audio stalled");
        });
        element.addEventListener("error", () => {
          setProof("Audio error", "browser audio element reported an error", "state-bad");
          setStatus("audio error", "failed");
          log("audio element error");
        });
        element.play().catch(() => {
          playBlocked = true;
          updatePlayerState();
          setStatus("tap Unlock Audio", "connected");
          log("audio is connected; tap Unlock Audio if iPhone blocks autoplay");
        });
      }

      async function getToken(passcode) {
        const response = await fetch("/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          cache: "no-store",
          body: JSON.stringify({
            room: "reaper-master",
            identity: `listener-${Math.random().toString(16).slice(2, 8)}`,
            passcode,
          }),
        });
        if (response.status === 401) {
          throw new Error("合言葉が違います");
        }
        if (!response.ok) {
          throw new Error(`token failed: ${response.status}`);
        }
        return response.json();
      }

      async function connect(passcode) {
        listenButton.disabled = true;
        setStatus("connecting");
        qualityEl.textContent = "connecting";
        resetAudio();

        if (room) {
          await room.disconnect();
          room = undefined;
        }

        await unlockAudioGesture().catch(() => {});
        const { url, token, identity, expiresInSeconds, permissions } = await getToken(passcode);
        setListenerMode(permissions);
        room = new Room({ adaptiveStream: false, dynacast: false });

        room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          log(`subscribed ${track.kind} from ${participant.identity}`);
          attachAudio(track, participant);
          setStatus("track subscribed", "connected");
        });

        room.on(RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach((element) => element.remove());
          resetAudio();
          log(`unsubscribed ${track.kind}`);
        });

        room.on(RoomEvent.ParticipantConnected, (participant) => {
          log(`participant ${participant.identity} joined`);
        });

        room.on(RoomEvent.ParticipantDisconnected, (participant) => {
          log(`participant ${participant.identity} left`);
          if (publisherEl.textContent === participant.identity) {
            resetAudio();
            setStatus("publisher offline");
          }
        });

        room.on(RoomEvent.TrackSubscriptionFailed, (trackSid, participant, reason) => {
          setStatus("subscription failed", "failed");
          log(`subscription failed ${trackSid || ""} ${reason || ""}`.trim());
        });

        room.on(RoomEvent.ConnectionStateChanged, (state) => {
          qualityEl.textContent = state;
          if (state === ConnectionState.Connected) {
            setStatus("waiting for audio", "connected");
          } else if (state === ConnectionState.Reconnecting) {
            setStatus("reconnecting");
          }
        });

        room.on(RoomEvent.Disconnected, (reason) => {
          setStatus("disconnected");
          qualityEl.textContent = "disconnected";
          log(`disconnected ${reason || ""}`.trim());
        });

        await room.connect(url, token, { autoSubscribe: true });
        const roomPermissions = room.localParticipant?.permissions || permissions;
        setListenerMode(roomPermissions);
        const canPublish = roomPermissions?.canPublish === true;
        if (canPublish) {
          log("WARNING: listener token can publish; expected subscribe-only");
        }
        log(`connected as ${identity}; token expires in ${expiresInSeconds || "unknown"}s; canPublish=${canPublish ? "true" : "false"}`);
        listenButton.disabled = false;
      }

      joinForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          await connect(passcodeInput.value);
        } catch (err) {
          listenButton.disabled = false;
          setStatus("failed", "failed");
          qualityEl.textContent = "failed";
          log(err.message || String(err));
        }
      });

      disconnectButton.addEventListener("click", async () => {
        if (room) {
          await room.disconnect();
          room = undefined;
        }
        resetAudio();
        setStatus("locked");
        qualityEl.textContent = "unknown";
        listenerModeEl.textContent = "locked";
        listenerModeEl.className = "";
        listenerModeDetailEl.textContent = "not connected";
      });

      unlockButton.addEventListener("click", async () => {
        if (!audioNode) {
          log("no audio track yet");
          return;
        }
        try {
          await unlockAudioGesture().catch(() => {});
          await audioNode.play();
          playBlocked = false;
          updatePlayerState();
          setProof("Playback unlocked", "waiting for inbound packet movement", "state-warn");
          setStatus("listening", "connected");
        } catch (err) {
          playBlocked = true;
          updatePlayerState();
          log(err.message || String(err));
        }
      });
    </script>
  </body>
</html>
